# ============== 应用基本信息 ==============
spring.application.name=springBootTest
spring.profiles.active=dev

# ============== 日志配置 ==============
logging.level.root=info
logging.level.com.fenglin.springboottest=debug
logging.level.com.fenglin.springboottest.mapper=trace
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %level %logger{50}.%M %L:%m%n

# ============== MySQL 数据源 ==============
# 注意：sky_login 数据库需先用 sql/sky_login.sql 脚本创建
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/sky_login?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ============== MyBatis-Plus 配置 ==============
# Mapper XML 路径（本项目用注解开发，可留空；保留以备扩展）
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
# 实体类别名包
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# 驼峰映射：数据库 user_name -> 实体 userName
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 日志输出：开发期打印 SQL 到控制台
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键自增策略
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除（本项目暂未启用，留作扩展）
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0
